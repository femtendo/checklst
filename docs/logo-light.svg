<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- CHECKLST mark: a dapper checkbox — bowtied checkmark in specs -->
  <rect x="8" y="8" width="80" height="80" rx="22" fill="#fdf6ea" stroke="#0f9b8e" stroke-width="4"/>
  <!-- checkmark -->
  <path d="M26 52 L42 67 L70 32" stroke="#0f9b8e" stroke-width="9" fill="none"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- glasses: two round lenses straddling the checkmark stroke, bridge + arms -->
  <circle cx="38" cy="46" r="11" fill="#0b0f14" opacity=".35" stroke="#1f2430" stroke-width="3.5"/>
  <circle cx="62" cy="44" r="11" fill="#0b0f14" opacity=".35" stroke="#1f2430" stroke-width="3.5"/>
  <path d="M49 45 Q52 42.5 55 44.5" stroke="#1f2430" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  <path d="M27 46 L18 43" stroke="#1f2430" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M73 44 L82 41" stroke="#1f2430" stroke-width="3.5" stroke-linecap="round"/>
  <!-- bowtie at the checkmark's elbow -->
  <g transform="translate(46 64)">
    <path d="M0 0 L-12 -7 L-12 7 Z" fill="#ec6ed0"/>
    <path d="M0 0 L12 -7 L12 7 Z" fill="#ec6ed0"/>
    <circle cx="0" cy="0" r="3.2" fill="#c94fb0"/>
  </g>
</svg>
